<article class="entity-card w-full" data-client="{{cif}}" role="button" tabindex="0">
  <span class="logo-rail {{railClass}}">{{logoInitial}}</span>
  <span class="entity-card-body">
    <span class="flex items-start justify-between gap-3">
      <span class="entity-card-title block">{{nombre_empresa}}</span>
      <button class="entity-delete" type="button" data-delete-client="{{cif}}" data-client-kind="{{clientKind}}" title="Borrar cliente" aria-label="Borrar cliente {{nombre_empresa}}">{{{deleteIcon}}}</button>
    </span>
    <span class="entity-card-meta block">{{cif}} - {{estado}}</span>
    <span class="my-3 block text-sm text-[rgba(216,208,189,0.72)]">{{necesidades}}</span>
    <span class="flex flex-wrap gap-1">{{{tagsHtml}}}</span>
  </span>
</article>
