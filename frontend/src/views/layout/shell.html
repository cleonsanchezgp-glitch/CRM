<div class="app-shell">
  <div class="crm-layout {{sidebarOpenClass}}">
    <aside class="sidebar">
      <div class="mb-6 flex items-center gap-3 px-1">
        <div class="sidebar-mark flex h-11 w-11 items-center justify-center rounded-lg bg-[#3a3936] text-[#de733e]">{{{boxesIcon}}}</div>
        <div class="sidebar-label">
          <p class="text-xs font-bold uppercase tracking-[0.16em] text-[#7c8569]">Argonesa</p>
          <p class="font-bold text-[#d8d0bd]">CRM APIs</p>
        </div>
      </div>
      <nav class="grid gap-1">
        {{{navItemsHtml}}}
      </nav>
    </aside>
    <main class="min-w-0">
      <header class="sticky top-0 z-10 border-b border-[rgba(255,253,244,0.12)] bg-[#1d1d1b]/92 px-4 py-3 backdrop-blur md:px-7">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-xs font-bold uppercase tracking-[0.16em] text-[#7c8569]">{{apiStatusLabel}}</p>
            <h1 class="text-2xl font-bold text-[#d8d0bd]">{{title}}</h1>
          </div>
          <div class="flex items-center gap-2">
            <label class="relative block w-full md:w-[360px]">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#7c8569]">{{{searchIcon}}}</span>
              <input id="global-search" class="w-full rounded-lg border border-[rgba(255,253,244,0.12)] bg-[#2b2b29] py-2.5 pl-10 pr-3 text-[#fffdf4] placeholder:text-[rgba(216,208,189,0.56)]" placeholder="Buscar nombre, CIF, id o #Docker" value="{{query}}" />
            </label>
            <button class="icon-button" title="Notificaciones">{{{bellIcon}}}</button>
            <button class="icon-button" id="logout" title="Cerrar sesion">{{{logoutIcon}}}</button>
          </div>
        </div>
      </header>
      <section class="p-4 md:p-7">
        {{{actionErrorHtml}}}
        {{{activeViewHtml}}}
      </section>
    </main>
  </div>
  {{{newClientModalHtml}}}
  {{{createModalHtml}}}
</div>
