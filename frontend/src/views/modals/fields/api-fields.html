<div class="form-grid">
  <label>
    <span>ID</span>
    <input name="id" required placeholder="{{idPlaceholder}}" />
  </label>
  <label>
    <span>Nombre</span>
    <input name="nombre" required placeholder="{{namePlaceholder}}" />
  </label>
</div>
<label>
  <span>Descripcion</span>
  <textarea name="descripcion" rows="4" placeholder="Funcion de la API, integraciones y uso previsto..."></textarea>
</label>
<label>
  <span>URL repositorio</span>
  <input name="url" placeholder="https://github.com/empresa/api" />
</label>
